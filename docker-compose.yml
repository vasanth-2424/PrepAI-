services:
  postgres:
    image: postgres:16-alpine
    container_name: prepai-postgres
    environment:
      POSTGRES_USER: prepai
      POSTGRES_PASSWORD: prepai
      POSTGRES_DB: prepai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepai -d prepai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
